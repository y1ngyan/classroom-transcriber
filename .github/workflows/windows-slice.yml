name: windows-slice

on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows-slice.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-slice.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        working-directory: windows
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        working-directory: windows
        run: cmake --build build --config Release
      # 单元测试**不加载模型**：模型不在仓库里，ct-win-tests 只链 ct-core
      # （WAV 解析 / 重采样 / 门控 / 取窗 / 合并）
      - name: Unit tests
        working-directory: windows
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Smoke test without arguments
        working-directory: windows
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter ct-win.exe build | Select-Object -First 1
          if (-not $exe) { throw "ct-win.exe not built" }
          & $exe.FullName
          if ($LASTEXITCODE -ne 2) { throw "expected exit 2, got $LASTEXITCODE" }
